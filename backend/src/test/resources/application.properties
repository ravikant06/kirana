# Tests start without Kafka. Tests that need it import KafkaContainerConfig and set
# kirana.kafka.enabled=true.
kirana.kafka.enabled=false

# No log file from tests: they run from backend/ and would write into the dev log (logs/kirana.log).
logging.file.name=

# Never reach the real warehouse-mock from tests (tests that need one mock WarehouseClient).
kirana.fulfilment.warehouse-url=http://localhost:1

# The hourly outbox/inbox cleanup (6f) is driven by its own test.
kirana.messaging.cleanup-enabled=false
