# Every value can be overridden with an environment variable (e.g. DB_HOST=...).
# The defaults match infra/docker-compose.yml, so locally you override nothing.

spring:
  application:
    name: kirana
  config:
    # Local secrets (Razorpay test keys) live in backend/.env, which git ignores.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kirana}
    username: ${DB_USER:kirana}
    password: ${DB_PASSWORD:kirana}
    hikari:
      # Stage 2f (P6): chosen, not inherited. 10 is plenty for one laptop instance: a
      # connection is busy only while a transaction runs, and ours take a few ms.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail in 3 s with a 503 instead of the default 30 s wait.
      connection-timeout: 3000

  jpa:
    # Keep the DB session tied to the transaction, not the whole HTTP request.
    # Lazy-loading outside a transaction will fail loudly instead of silently querying.
    open-in-view: false
    hibernate:
      # Flyway creates and changes tables. Hibernate only checks entities match them.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  kafka:
    # Stage 6. compose exposes the broker to the host on 9094 (9092 is for other containers).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: the broker confirms only once the write is stored (on every in-sync copy).
      acks: all
      properties:
        # Idempotent producer: a retried send cannot write the same record twice.
        enable.idempotence: true
        # Give up on a send after 10 s instead of the 2-minute default.
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    # Stage 6c consumers. We commit offsets ourselves (ack-mode manual), only after the work is
    # committed to Postgres; auto-commit would commit on a timer, possibly before the work is done.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest   # a brand-new group starts from the oldest record, not "now"
      properties:
        # Stage 6f: how long the broker waits for a silent (crashed) member before giving its
        # partitions to another instance. Default 45 s (seen in 6c); 10 s with a heartbeat every
        # 3 s. Lower means faster takeover but more false alarms on a long GC pause.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: manual

  task:
    scheduling:
      pool:
        # PaymentJobs and OutboxRelay are @Scheduled. The default is ONE thread for all of them,
        # so a relay waiting on Kafka would delay the payment jobs, and the other way round.
        size: 4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}   # compose maps Kirana's Redis to 6380 (see docker-compose.yml)
      # Redis answers in well under a millisecond. If it does not answer in 200 ms, treat it as
      # down and fall back to Postgres (fail open, D42) instead of hanging the request.
      timeout: 200ms
      connect-timeout: 500ms

server:
  port: 8080

kirana:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}          # what browsers use (signed URLs)
    api-endpoint: ${STORAGE_API_ENDPOINT:}                       # what the backend calls; empty = endpoint
    region: us-east-1
    connect-timeout: 1s
    read-timeout: 5s
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:product-images}
    max-upload-bytes: 5242880   # 5 MB, enforced by the signed POST policy
    upload-url-ttl: 10m
  cache:
    product-ttl: 10m        # product detail; +-20% jitter so keys cached together expire apart
    list-ttl: 30s           # product list pages: TTL-only, a new product shows within 30 s (D41)
    negative-ttl: 60s       # "product does not exist", against cache penetration
    lock-ttl: 3s            # single-flight rebuild lock, against cache stampede
    lock-wait: 200ms        # how long other requests wait for the rebuilder before going to the DB
  rate-limit:
    # Token buckets per shopper (D43): "limit per window" = burst size and sustained rate.
    orders:
      limit: 5
      window: 1m
    cart:
      limit: 20
      window: 10s
  payment:
    default-provider: mock
    currency: INR
    window: 10m             # stock is held this long for payment, then the expiry job releases it
    # Unpaid orders older than this are checked with the gateway. Webhooks (6c) settle orders in
    # about a second, so polling is only the safety net and need not be quick. A gateway whose
    # webhooks cannot reach us (Razorpay without a tunnel) keeps the quick check.
    reconcile-after: 10m
    reconcile-after-without-webhooks: 1m
    recheck-closed-for: 30m # Stage 6c: closed orders are re-checked this long for a late payment
    unknown-grace: 1h       # Stage 6c: past due but the gateway has no record: hold this long, then close
    http:
      # Stage 5 latency budget: with 3 attempts (Resilience), a dead gateway costs at most
      # ~3 x 2 s + backoff before the shopper hears "pay later", and the breaker cuts that to 0.
      connect-timeout: 1s
      read-timeout: 2s
    mock:
      # payment-mock imitates Razorpay's API (infra/docker-compose.yml). Not real secrets.
      api-url: ${PAYMENT_MOCK_URL:http://localhost:8090}
      checkout-url: http://localhost:8090
      key-id: rzp_test_kiranamock
      key-secret: kirana-mock-secret
      webhook-secret: kirana-mock-webhook-secret
    razorpay:
      api-url: https://api.razorpay.com
      checkout-url:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}   # only if you expose a webhook URL (tunnel)
  fulfilment:
    # Stage 6e. events: an OrderPaid consumer sends paid orders to the warehouse (retries until
    # it answers). naive: the payment step calls the warehouse right after its commit, the dual
    # write, kept only to reproduce its problems. Needs a restart to change.
    mode: ${FULFILMENT_MODE:events}
    warehouse-url: ${WAREHOUSE_URL:http://localhost:8091}
    api-key: kirana-warehouse-key   # warehouse-mock's (infra/docker-compose.yml); not a real secret
    connect-timeout: 1s
    read-timeout: 2s
  resilience:
    enabled: true   # false = no retries, breakers or bulkhead (for before/after measurements)
  chaos:
    enabled: false  # the chaos profile turns this on (fault controls in Manage)
    toxiproxy-url: http://localhost:8474
    payment-mock-admin-url: http://localhost:8090
  messaging:
    retention: 7d   # Stage 6f: published outbox rows and processed_events older than this are deleted
  outbox:
    relay-interval-ms: 500   # how often the relay looks for unpublished events
    batch-size: 100
  kafka:
    enabled: ${KAFKA_ENABLED:true}   # false: no topics, no producers or consumers (most tests)
    topics:
      partitions: 3
  diagnostics:
    # Stage 2: X-Query-Count / X-DB-Time-Ms headers and one log line per request.
    query-metrics: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  # Also write the log to a file (backend/logs/kirana.log when started from backend/), so the
  # Stage 6 flow can be followed with tail + grep instead of the scrolling terminal.
  file:
    name: ${KIRANA_LOG_FILE:logs/kirana.log}
  level:
    # Stage 1 observation: print every SQL statement Hibernate sends.
    org.hibernate.SQL: DEBUG
    # The Kafka client prints its whole configuration on every connect; keep warnings only.
    org.apache.kafka: WARN
    # Uncomment to also see the bound parameter values (very noisy):
    # org.hibernate.orm.jdbc.bind: TRACE
