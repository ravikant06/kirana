# Local dependencies only: Postgres, MinIO, Redis, and Qdrant (AI track, kirana-ai/).
# Our own app (backend, frontend) runs directly on your machine in Stage 1.
# Containerizing the app itself is Stage 10.
#
#   cd infra && docker compose up -d
#
name: kirana

services:
  postgres:
    image: postgres:17
    # Stage 2: pg_stat_statements records every query's calls and total time.
    # It must be preloaded at server start; the extension itself is created once with
    # CREATE EXTENSION (see infra/seed/README.md).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: kirana
      POSTGRES_USER: kirana
      POSTGRES_PASSWORD: kirana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirana -d kirana"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Upstream minio/minio was archived in 2026 and its images are frozen.
    # pgsty/minio is the maintained community fork: same env vars, same command.
    # Pinned to a release so everyone gets identical behaviour.
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (backend and browser uploads)
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data

  redis:
    # Stage 4: cache, rate limiter and flash-sale gate. Redis 8 is AGPL/RSAL/SSPL-licensed;
    # valkey/valkey:8 is the BSD fork with the same protocol, so switching is config only.
    image: redis:8
    # No persistence: everything in Redis can be rebuilt from Postgres (cache-aside).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Host port 6380, not 6379: a locally installed Redis often already owns 6379, and the
      # app would silently talk to that one instead (it happened while building Stage 4).
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-mock:
    # Stage 5: a Razorpay-shaped test gateway that can be made slow, down or flaky.
    build: ../payment-mock
    environment:
      MOCK_KEY_ID: rzp_test_kiranamock
      MOCK_KEY_SECRET: kirana-mock-secret
    ports:
      - "8090:8090"   # API + hosted checkout page: http://localhost:8090/docs

  toxiproxy:
    # Stage 5: a TCP proxy that injects network faults (latency, timeouts, dropped
    # connections) between the backend and Redis, MinIO and payment-mock. Only used when the
    # backend runs with the "chaos" profile; otherwise the backend talks to them directly.
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"     # control API
      - "26379:26379"   # -> redis
      - "29000:29000"   # -> minio
      - "28090:28090"   # -> payment-mock
    depends_on: [redis, minio, payment-mock]

  kafka:
    # Stage 6: one Kafka broker in KRaft mode (Kafka's own controller; no ZooKeeper).
    # Two listeners: "kafka:9092" for containers (Kafka UI), "localhost:9094" for the backend.
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker, so internal topics can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose by the backend (KafkaConfig), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    # See topics, partitions, messages, offsets and consumer lag: http://localhost:8085
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: kirana
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on: [kafka]

  qdrant:
    # AI track (kirana-ai/): vector store for the assistant's knowledge base.
    # Pinned: Qdrant upgrades its on-disk format in place, and an older image may not
    # read data written by a newer one.
    image: qdrant/qdrant:v1.19.1
    ports:
      # Host ports 6335/6336, not 6333/6334: the standalone rag-project container owns
      # those, and both can run side by side (same reason Redis is on 6380).
      - "6335:6333"   # REST + dashboard: http://localhost:6335/dashboard
      - "6336:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  pgdata:
  minio-data:
  kafka-data:
  qdrant-data:
