# Alembic owns schema `ai` (the Python counterpart of Kirana's Flyway).
#
#   alembic upgrade head        apply pending migrations
#   alembic current             show the applied revision
#   alembic history             list revisions
#
# The database URL comes from kirana_ai.config (DATABASE_URL / .env), not from here.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
